version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: esiee_project_db
    restart: always

    environment:
      MYSQL_DATABASE: project_si_db
      MYSQL_USER: project_user
      MYSQL_PASSWORD: project_password
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3307:3306"

    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
